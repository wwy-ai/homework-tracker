<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#236653"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="viewport" content="width=device-width,initial-scale=1"><title>課後簿 · 功課跟進</title><style>
:root{--ink:#173f39;--green:#236653;--paper:#f5f5ed;--line:#e0e5dd;--muted:#758278}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px -apple-system,BlinkMacSystemFont,"PingFang TC",sans-serif}button,input,select{font:inherit}button{cursor:pointer}button,select,input{border:1px solid var(--line);border-radius:10px;padding:11px;background:white;color:var(--ink)}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #e6b44c}button.primary{background:var(--green);color:white;border-color:var(--green)}button.active{background:#e0ece3;border-color:#639a7b}header{padding:24px 5%;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);background:#fffdf7}.brand{font-weight:800;font-size:25px;letter-spacing:2px}.brand small{font-size:12px;letter-spacing:1px;font-weight:400;display:block;margin-top:5px}.badge{font-size:12px;padding:6px 10px;border-radius:20px;background:#eee9d8;color:#6b654f}main{max-width:1120px;margin:auto;padding:30px 24px 100px}h1{font-size:32px;letter-spacing:1px;margin:8px 0}h2{font-size:19px;margin:0 0 15px}p{line-height:1.7}.muted{color:var(--muted);font-size:13px}.intro{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.classes{display:flex;gap:8px;overflow:auto;margin:20px 0}.classes button{white-space:nowrap}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:22px 0}.stat{background:white;border:1px solid var(--line);padding:19px;border-radius:16px;text-align:left}.stat b{display:block;font:38px Georgia,serif;margin-top:10px}.stat:nth-child(1) b{color:#b5633a}.stat:nth-child(2) b{color:#9b782b}.grid{display:grid;grid-template-columns:1.25fr 1fr;gap:20px}.panel{background:#fffefa;border:1px solid var(--line);padding:22px;border-radius:17px;margin-bottom:18px}.item{padding:16px 0;border-bottom:1px solid var(--line)}.item:last-child{border-bottom:0}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.wrap{display:flex;gap:8px;flex-wrap:wrap}.pill{font-size:12px;background:#f2e7d2;color:#86621d;padding:5px 8px;border-radius:6px}.task-name{font-weight:650;font-size:16px;margin-bottom:6px}.progress{height:5px;background:#e9ede5;border-radius:5px;margin:12px 0}.progress span{display:block;height:100%;background:#77a68a;border-radius:5px}.notice{padding:12px 16px;background:#eaf0e5;border-radius:10px;font-size:13px;line-height:1.6}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.student{padding:15px 0;border-bottom:1px solid var(--line)}.student .wrap{margin-top:10px}.student button{padding:9px 12px;font-size:13px}.num{color:var(--muted);font-size:12px;margin-right:10px}.nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;gap:14px;background:#fffef8f5;border-top:1px solid var(--line);padding:10px 12px max(10px,env(safe-area-inset-bottom));z-index:5}.nav button{border:0;background:none;min-width:90px}.nav button.active{background:#e4ede4;font-weight:700}.empty{padding:30px;text-align:center;color:var(--muted)}dialog{border:0;border-radius:20px;max-width:540px;width:calc(100% - 30px);padding:24px;background:#fffef8;color:var(--ink)}dialog::backdrop{background:#173f3970}label{display:block;margin:15px 0 7px}dialog input,dialog select{width:100%}#toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--ink);color:white;border-radius:10px;padding:12px 20px;z-index:20;display:none}.photo{border:2px dashed #bdd0bf;padding:22px;text-align:center;border-radius:14px;margin:15px 0}img.preview{max-height:140px;max-width:100%;border-radius:10px}@media(max-width:650px){main{padding:22px 16px 100px}header{padding:18px 20px}.brand{font-size:22px}h1{font-size:27px}.grid{grid-template-columns:1fr;gap:0}.stats{gap:8px}.stat{padding:14px 11px}.stat b{font-size:31px}.stat span{font-size:12px}.intro{align-items:flex-start}.panel{padding:17px}.nav{gap:0}.nav button{min-width:0;flex:1;padding:12px 5px;font-size:13px}.row select{max-width:100%}}
</style><header><div class="brand">▤ 課後簿<small>讓每一份功課，都有着落。</small></div><span class="badge">離線工作簿 · 本機儲存</span></header><main id="app"></main><nav class="nav" id="nav"></nav><dialog id="modal"></dialog><div id="toast" role="status"></div><script>
const groups=[['中一 B','普通話',36],['中一 1AB2','中國語文',25],['中三 3AB1','中國語文',25],['中五 5AB3','中國語文',18]],names=['陳思晴','李俊熙','黃芷欣','張皓軒','林梓晴','何柏言','梁樂瑤','吳子朗','鄭嘉怡','劉宇軒','周曉彤','徐卓謙'];
const today=()=>new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Hong_Kong'});let db={students:[],tasks:[]},busy=false;let page='home',cls='all',taskId='',filter='all',query='',undo=null;const app=document.getElementById('app'),modal=document.getElementById('modal');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const options=(arr,val)=>arr.map(x=>`<option ${x===val?'selected':''}>${esc(x)}</option>`).join('');function toast(s){let t=document.getElementById('toast');t.textContent=s;t.style.display='block';setTimeout(()=>t.style.display='none',3500)}async function load(){try{db=JSON.parse(localStorage.getItem('homework-offline-v1'))||{students:[],tasks:[]};render()}catch(e){app.innerHTML='<p>無法讀取裝置資料，請檢查瀏覽器儲存設定。</p>'}}function save(){try{localStorage.setItem('homework-offline-v1',JSON.stringify(db));toast('已儲存在這部裝置 · 請定期匯出備份');render()}catch(e){toast('儲存失敗：空間不足或瀏覽器禁止儲存，請立即匯出備份')}}function mutate(fn){undo=JSON.stringify(db);fn();save()}
function tasks(){return db.tasks.filter(t=>cls==='all'||t.c==cls)}function rec(t,s){return t.records[s.id]||{s:'未交',r:'不需改正',a:false}}function eligible(t){return db.students.filter(s=>s.c===t.c&&s.start<=t.due)}function issues(kind){return tasks().flatMap(t=>eligible(t).filter(s=>kind==='missing'?rec(t,s).s==='未交'&&t.due<=today():rec(t,s).r==='欠改正').map(s=>({t,s,r:rec(t,s)})))}function chips(){return `<div class="classes"><button class="${cls==='all'?'active':''}" onclick="setClass('all')">全部班別</button>${groups.map((g,i)=>`<button class="${cls==i?'active':''}" onclick="setClass('${i}')">${g[0]} <small>· ${db.students.filter(s=>s.c===i).length}</small></button>`).join('')}</div>`}function setClass(c){cls=c;render()}function go(p){page=p;filter='all';render();window.scrollTo(0,0)}function openTask(id){taskId=id;page='record';filter='all';query='';render();window.scrollTo(0,0)}function pending(){return tasks().filter(t=>t.stage!=='完成').sort((a,b)=>a.follow.localeCompare(b.follow))}function taskCard(t){let st=eligible(t),done=st.filter(s=>rec(t,s).s!=='未交').length;return `<div class="item"><div class="row"><div><div class="task-name">${esc(t.title)}</div><div class="muted">${groups[t.c][0]} · 截止 ${t.due.slice(5)}</div></div><span class="pill">${t.stage}</span></div><div class="progress"><span style="width:${st.length?done/st.length*100:0}%"></span></div><div class="row"><span class="muted">已交 ${done} / ${st.length} 人</span><button onclick="openTask('${t.id}')">登記／跟進 →</button></div></div>`}
function render(){document.getElementById('nav').innerHTML=[['home','⌂ 待辦首頁'],['record','✓ 收交登記'],['follow','◷ 學生跟進'],['students','☷ 學生名單']].map(([p,n])=>`<button class="${page===p?'active':''}" onclick="go('${p}')">${n}</button>`).join('');if(page==='home'){app.innerHTML=`<div class="intro"><div><div class="muted">老師的工作桌 / ${new Date().toLocaleDateString('zh-HK',{timeZone:'Asia/Hong_Kong',month:'long',day:'numeric',weekday:'long'})}</div><h1>今天，從這裏開始。</h1><div class="muted">四個教學班，無網絡也可登記。</div></div><button class="primary" onclick="newTask()">＋ 新功課</button></div><div class="notice">離線版：紀錄只存於這部裝置，不會自動跨裝置同步。清除瀏覽器資料會移除紀錄，請定期匯出備份。首次使用請到「學生名單」匯入名單。</div>${chips()}<div class="stats"><button class="stat" onclick="page='follow';filter='missing';render()"><span>待追蹤欠交 · 人次</span><b>${issues('missing').length}</b></button><button class="stat" onclick="page='follow';filter='correction';render()"><span>欠改正 · 人次</span><b>${issues('correction').length}</b></button><button class="stat" onclick="document.getElementById('work').scrollIntoView({behavior:'smooth'})"><span>老師待處理 · 份</span><b>${pending().length}</b></button></div><div class="grid"><section class="panel" id="work"><div class="row"><h2>我的待辦</h2><span class="muted">按跟進日期排列</span></div>${pending().map(t=>`<div class="item"><div class="row"><span class="pill">${t.follow<=today()?'到期跟進':'稍後處理'} · ${t.follow.slice(5)}</span><span class="muted">${groups[t.c][0]}</span></div><p class="task-name">${esc(t.title)}</p><div class="row"><span>${t.stage}</span><button onclick="openTask('${t.id}')">處理 →</button></div></div>`).join('')||'<div class="empty">目前沒有待辦 ✓</div>'}</section><section class="panel"><h2>最近的功課</h2>${tasks().slice(0,4).map(taskCard).join('')}</section></div>`}
if(page==='record'&&!db.tasks.length){app.innerHTML='<h1>開始登記功課</h1><section class="panel"><p>請先在學生名單匯入資料。建立第一份功課後，便可登記收交及改正進度。</p><button class="primary" onclick="newTask()">＋ 建立功課</button></section>';return}if(page==='record'){let t=db.tasks.find(t=>t.id===taskId)||db.tasks[0];taskId=t.id;let list=eligible(t).filter(s=>(!query||s.name.includes(query)||String(s.no).includes(query))&&(filter==='all'||filter==='missing'&&rec(t,s).s==='未交'||filter==='correction'&&rec(t,s).r==='欠改正'));app.innerHTML=`<div class="intro"><div><div class="muted">先選功課，再核實科長記錄</div><h1>收交登記</h1></div><button onclick="photo()">▧ 拍照登記</button></div><select aria-label="選擇功課" style="width:100%" onchange="taskId=this.value;filter='all';render()">${db.tasks.map(x=>`<option value="${x.id}" ${x.id===t.id?'selected':''}>${groups[x.c][0]}｜${esc(x.title)}</option>`).join('')}</select><section class="panel" style="margin-top:16px"><div class="row"><div><b>${esc(t.title)}</b><p class="muted">截止 ${t.due} · 遲交由你手動判定</p></div><button onclick="newTask()">＋ 功課</button></div><label>老師工作進度</label><select aria-label="老師工作進度" onchange="mutate(()=>db.tasks.find(x=>x.id===taskId).stage=this.value)">${options(['待核實收交','待批改','批改中','待覆查改正','完成'],t.stage)}</select><label>下次跟進日期</label><input aria-label="下次跟進日期" type="date" value="${t.follow}" onchange="mutate(()=>db.tasks.find(x=>x.id===taskId).follow=this.value)"><div class="toolbar"><button onclick="mutate(()=>eligible(db.tasks.find(x=>x.id===taskId)).forEach(s=>{let t=db.tasks.find(x=>x.id===taskId);t.records[s.id]={...rec(t,s),s:'已交'}}))">全班標記已交</button><button ${!undo?'disabled':''} onclick="if(undo){db=JSON.parse(undo);undo=null;save()}">撤銷上一步</button></div><div class="notice">A／圈＝當日缺席，獨立保留；不會自動當作已交或豁免。</div></section><div class="toolbar"><input aria-label="搜尋學生" placeholder="搜尋姓名或學號" value="${esc(query)}" oninput="query=this.value;render();let e=document.querySelector('[aria-label=\"搜尋學生\"]');e.focus();e.setSelectionRange(query.length,query.length)"><select aria-label="篩選學生" onchange="filter=this.value;render()"><option value="all" ${filter==='all'?'selected':''}>全部學生</option><option value="missing" ${filter==='missing'?'selected':''}>只看未交</option><option value="correction" ${filter==='correction'?'selected':''}>只看欠改正</option></select></div><section class="panel"><div class="row"><h2>學生名單</h2><span class="muted">${list.length} 人 · 點選即儲存</span></div>${list.map(s=>{let r=rec(t,s);return `<div class="student"><div class="row"><b><span class="num">${esc(s.homeClass||'')} ${String(s.no).padStart(2,'0')}</span>${esc(s.name)}</b><button class="${r.a?'active':''}" onclick="update('${s.id}','a',${!r.a})">${r.a?'A 缺席':'標記缺席'}</button></div><div class="wrap">${['未交','已交','遲交'].map(v=>`<button class="${r.s===v?'active':''}" onclick="update('${s.id}','s','${v}')">${v}</button>`).join('')}<select aria-label="${esc(s.name)}改正進度" onchange="update('${s.id}','r',this.value)">${options(['不需改正','欠改正','已改正'],r.r)}</select></div></div>`}).join('')||'<div class="empty">沒有符合條件的學生</div>'}</section>`}
if(page==='follow'){if(filter==='all')filter='missing';let list=issues(filter);app.innerHTML=`<div class="muted">集中處理，逐項完成</div><h1>學生跟進</h1>${chips()}<div class="toolbar"><button class="${filter==='missing'?'active':''}" onclick="filter='missing';render()">欠交 ${issues('missing').length}</button><button class="${filter==='correction'?'active':''}" onclick="filter='correction';render()">欠改正 ${issues('correction').length}</button></div><p class="muted">欠交清單只列出已到截止日期的未交紀錄；缺席學生另有標示。</p><section class="panel">${list.map(({t,s,r})=>`<div class="item"><div class="row"><div><b>${esc(s.name)} ${r.a?'<span class="pill">A 缺席</span>':''}</b><div class="muted">${groups[s.c][0]} · ${esc(s.homeClass||'')} ${s.no} 號</div></div><button onclick="resolve('${t.id}','${s.id}','${filter}')">${filter==='missing'?'登記補交':'確認已改正'}</button></div><p>${esc(t.title)}</p><button onclick="openTask('${t.id}')">查看功課 →</button></div>`).join('')||'<div class="empty">這一項已全部完成 ✓</div>'}</section>`}
if(page==='students'){app.innerHTML=`<div class="intro"><div><div class="muted">2026–27 學年 · 正式名單</div><h1>學生名單</h1></div><button class="primary" onclick="newStudent()">＋ 插班生</button></div>${chips()}<div class="toolbar"><button onclick="exportBackup()">匯出備份</button><button onclick="pickImport()">匯入名單／還原備份</button></div><div class="notice">可新增插班生，並設定開始計算功課的日期。可匯入下方指定的名單 JSON 檔。</div><section class="panel" style="margin-top:16px">${db.students.filter(s=>cls==='all'||s.c==cls).map(s=>`<div class="item row"><div><b>${esc(s.name)}</b><div class="muted">${groups[s.c][0]} · ${esc(s.homeClass||'')} ${s.no} 號</div></div><button onclick="studentDetail('${s.id}')">查看紀錄</button></div>`).join('')}</section>`}}
function update(id,k,v){mutate(()=>{let t=db.tasks.find(x=>x.id===taskId),s=db.students.find(x=>x.id===id);t.records[id]={...rec(t,s),[k]:v}})}function resolve(tid,sid,type){if(type==='correction'){mutate(()=>{let t=db.tasks.find(x=>x.id===tid),s=db.students.find(x=>x.id===sid);t.records[sid]={...rec(t,s),r:'已改正'}})}else{modal.innerHTML=`<h2>登記補交</h2><p>請手動決定這次繳交是否屬於遲交。</p><div class="wrap"><button onclick="finishResolve('${tid}','${sid}','已交')">已交</button><button class="primary" onclick="finishResolve('${tid}','${sid}','遲交')">遲交</button><button onclick="modal.close()">取消</button></div>`;modal.showModal()}}function finishResolve(tid,sid,v){mutate(()=>{let t=db.tasks.find(x=>x.id===tid),s=db.students.find(x=>x.id===sid);t.records[sid]={...rec(t,s),s:v}});modal.close()}
function form(title,body,submit){modal.innerHTML=`<form id="form"><h2>${title}</h2>${body}<div class="toolbar"><button class="primary" type="submit">儲存</button><button type="button" onclick="modal.close()">取消</button></div></form>`;document.getElementById('form').onsubmit=e=>{e.preventDefault();submit(new FormData(e.target))};modal.showModal()}function classSelect(){return `<select name="c">${groups.map((g,i)=>`<option value="${i}" ${cls==i?'selected':''}>${g[0]} · ${g[1]}</option>`).join('')}</select>`}function newStudent(){form('新增插班生',`<label>教學班</label>${classSelect()}<label>原班別</label><input name="homeClass" maxlength="10" required placeholder="例如 1A"><label>學號</label><input name="no" type="number" min="1" max="999" required><label>姓名</label><input name="name" maxlength="40" required><label>由這天開始計算功課</label><input name="start" type="date" value="${today()}" required><p class="muted">截止日期早於此日的功課，不會列入欠交。</p>`,f=>{let c=+f.get('c'),no=+f.get('no'),name=f.get('name').trim();if(!name)return;if(db.students.some(s=>s.c===c&&s.no===no&&s.homeClass===f.get('homeClass').trim())){toast('這個班已有相同學號，請核對');return}mutate(()=>db.students.push({id:'s'+Date.now(),c,no,name,homeClass:f.get('homeClass').trim(),start:f.get('start')}));modal.close()})}function newTask(){form('建立新功課',`<label>教學班</label>${classSelect()}<label>功課名稱</label><input name="title" required maxlength="100"><label>繳交截止日期</label><input name="due" type="date" value="${today()}" required><label>提醒自己跟進</label><input name="follow" type="date" value="${today()}" required>`,f=>{if(!f.get('title').trim())return;let t={id:'t'+Date.now(),c:+f.get('c'),title:f.get('title').trim(),due:f.get('due'),follow:f.get('follow'),stage:'待核實收交',records:{}};mutate(()=>db.tasks.push(t));modal.close();openTask(t.id)})}function studentDetail(id){let s=db.students.find(s=>s.id===id);modal.innerHTML=`<h2>${esc(s.name)}的紀錄</h2><p class="muted">${groups[s.c][0]} · ${esc(s.homeClass||'')} ${s.no} 號</p>${db.tasks.filter(t=>t.c===s.c&&t.due>=s.start).map(t=>`<div class="item"><b>${esc(t.title)}</b><p>${rec(t,s).s} · ${rec(t,s).r}${rec(t,s).a?' · A 缺席':''}</p></div>`).join('')||'<p>暫無適用功課</p>'}<button onclick="modal.close()">關閉</button>`;modal.showModal()}
function photo(){modal.innerHTML=`<h2>拍照登記</h2><p class="muted">目前功課：${esc(db.tasks.find(t=>t.id===taskId).title)}</p><div class="notice">這是操作流程示範，尚未連接文字辨識服務。選取的照片只作本機預覽，不會被辨識或上傳。</div><label>照片類型（流程示範）</label><select id="ptype"><option>科長收交表（✓／✗／A／圈）</option><option>功課封面姓名</option></select><div class="photo"><input aria-label="選取或拍攝照片" id="pic" type="file" accept="image/*" capture="environment"><div id="preview"></div></div><div class="wrap"><button class="primary" onclick="photoReview()">試用模擬核實流程</button><button onclick="modal.close()">取消</button></div>`;document.getElementById('pic').onchange=e=>{let f=e.target.files[0];if(f){let u=URL.createObjectURL(f),im=document.createElement('img');im.className='preview';im.alt='所選照片預覽';im.src=u;im.onload=()=>URL.revokeObjectURL(u);document.getElementById('preview').replaceChildren(im)}};modal.showModal()}
let reviewIds=[];function photoReview(){let t=db.tasks.find(t=>t.id===taskId),cover=document.getElementById('ptype').selectedIndex===1;reviewIds=eligible(t).slice(0,cover?1:4).map(s=>s.id);modal.innerHTML=`<h2>核實辨識結果 · 模擬</h2><div class="notice">以下是固定示例，與你選取的照片內容無關。本頁不會寫入正式紀錄。黃色項目模擬不確定的辨識。</div>${reviewIds.map((id,i)=>{let s=db.students.find(s=>s.id===id);return `<div class="item"><b>${esc(s.homeClass||'')} ${s.no} 號 ${esc(s.name)}</b>${i===2?'<p class="pill">模擬：A／圈，請核對缺席</p>':''}<label>收交狀態</label><select id="rs${i}">${options(['未交','已交','遲交'],i===1?'未交':'已交')}</select><label><input type="checkbox" id="ra${i}" ${i===2?'checked':''} style="width:auto"> 當日缺席</label></div>`}).join('')}<div class="toolbar"><button class="primary" onclick="modal.close()">僅預覽，關閉示範</button><button onclick="modal.close()">取消</button></div>`}function confirmPhoto(){let rows=reviewIds.map((id,i)=>({id,s:document.getElementById('rs'+i).value,a:document.getElementById('ra'+i).checked}));mutate(()=>{let t=db.tasks.find(t=>t.id===taskId);rows.forEach(x=>{let s=db.students.find(s=>s.id===x.id);t.records[x.id]={...rec(t,s),s:x.s,a:x.a}})});modal.close()}load().catch(e=>{app.innerHTML='<section class="panel"><h1>暫時無法載入</h1><p>請檢查網絡及登入狀態。</p><button onclick="location.reload()">重新載入</button></section>'});document.addEventListener("visibilitychange",()=>{if(!document.hidden&&!busy)load().catch(e=>toast(e.message))});

function exportBackup(){let b=new Blob([JSON.stringify({format:'homework-offline-v1',data:db},null,2)],{type:'application/json'});let u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='功課紀錄備份-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function pickImport(){let i=document.createElement('input');i.type='file';i.accept='.json,application/json';i.onchange=async()=>{try{let v=JSON.parse(await i.files[0].text());if(v.format==='homework-roster-v1'){if(db.students.length){toast('已有學生名單，請用新增插班生；不會覆蓋現有學生');return}if(!Array.isArray(v.students)||v.students.some(s=>!s.id||!s.name||!Number.isInteger(s.c)||s.c<0||s.c>3||!Number.isInteger(s.no)||!/^\d{4}-\d{2}-\d{2}$/.test(s.start)))throw Error('名單格式不正確');if(new Set(v.students.map(s=>s.id)).size!==v.students.length)throw Error('名單有重複識別碼');mutate(()=>db.students=v.students)}else if(v.format==='homework-offline-v1'&&Array.isArray(v.data?.students)&&Array.isArray(v.data?.tasks)){if(confirm('還原會取代這部裝置的現有紀錄。請先匯出備份。是否繼續？'))mutate(()=>db=v.data)}else throw Error('檔案格式不正確')}catch(e){toast('匯入失敗：'+e.message)}};i.click()}
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('./sw.js').catch(()=>toast('離線快取未完成，請保持連線重新載入'));
</script></html>
